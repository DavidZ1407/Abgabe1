<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Game</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="./script.js"></script>
    <script defer src="./eia1_voyager_sdk.min.js"></script>
</head>

<body>
    <div id="startScreen">
        <p>Press <br> <span class="jumpText">Jump</span> to Start</p>
    </div>
    <div id="endScreen">
        <p>Game Over! <br> Press <span class="resetText">Reset</span> to Start Over</p>
    </div>
    <div class="game">
        <div id="player" class="hidden"></div>
        <div id="spikes" class="hidden"></div>
        <img id="image_background" />
        <div id="scoreBoard">Score: 0</div>
        <button id="jumpButton">Jump</button>
        <button id="resetButton">Reset</button>
    </div>
</body>

</html>
